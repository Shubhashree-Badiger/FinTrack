# Render Blueprint: one web service (UI + API) and one PostgreSQL database.
services:
  - type: web
    name: fintrack
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-db
          property: connectionString
databases:
  - name: fintrack-db
    plan: free
